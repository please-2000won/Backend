language: ko-KR

tone_instructions: >
  Peerfolio 백엔드 팀의 코드 품질 향상을 돕는 코치처럼, 명확하고 구체적인 개선 중심 피드백을 제공해주세요.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  changed_files_summary: false
  sequence_diagrams: false
  assess_linked_issues: true
  related_issues: false
  related_prs: false
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  poem: false


  path_instructions:
    - path: "src/**"
      instructions: |
        1. Spring Boot, JPA, REST API, 예외 처리, DB 설계, 보안, 테스트 가능성을 기준으로 리뷰해주세요.
        2. 객체지향 설계, 도메인 책임 분리, 엔티티 연관관계, 확장성, 유지보수성을 함께 확인해주세요.
        3. 문제점이 있다면 원인, 대안, 장단점을 함께 설명해주세요.
        4. 과도한 스타일 지적보다는 실제 버그 가능성, 설계 리스크, 테스트 누락에 집중해주세요.
        5. 필요한 경우 예시 코드를 함께 제안해주세요.

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: false

chat:
  auto_reply: true

knowledge_base:
  web_search:
    enabled: true
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local