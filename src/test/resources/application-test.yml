spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:peerfolio-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  mail:
    host: localhost
    port: 587
    username: test@example.com
    password: test-password

jwt:
  secret: peerfolio-test-jwt-secret-key-for-test-environment-only
  expiration: 3600000

auth:
  email-code:
    expose-in-response: false

cors:
  allowed-origins: http://localhost:3000
