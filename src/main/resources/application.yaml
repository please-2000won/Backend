spring:
  application:
    name: peerfolio
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

auth:
  email-code:
    expose-in-response: false

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN}
